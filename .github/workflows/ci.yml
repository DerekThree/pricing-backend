name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v5
        with:
          path: pricing-backend

      - name: Check out engine migrations
        uses: actions/checkout@v5
        with:
          repository: DerekThree/pricing-engine
          ref: main
          path: pricing-engine
          sparse-checkout: |
            src/main/resources/db/migration
            src/main/resources/db/postgresql

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run backend tests and build
        working-directory: pricing-backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Build Docker image
        run: docker build -f pricing-backend/Dockerfile -t pricing-backend:ci .
        
      - name: Export verified Docker image
        if: github.event_name == 'push'
        run: docker save pricing-backend:ci -o pricing-backend-image.tar

      - name: Upload Docker image artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: pricing-backend-image
          path: pricing-backend-image.tar
          if-no-files-found: error
          retention-days: 1
