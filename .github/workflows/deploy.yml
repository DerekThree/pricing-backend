name: Backend Deployment

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

permissions:
  actions: read
  id-token: write

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::064550674390:role/pricing-backend-github-deploy
          aws-region: us-east-1

      - name: Verify ECS is ready
        run: |
          service_json=$(aws ecs describe-services \
            --cluster pricing-app-cluster \
            --services pricing-backend-service \
            --output json)

          if ! jq -e '
            (.services[0].status == "ACTIVE") and
            (.services[0].desiredCount > 0) and
            (.services[0].runningCount >= .services[0].desiredCount) and
            (.services[0].deployments | length == 1) and
            (.services[0].deployments[0].rolloutState == "COMPLETED")
          ' <<< "$service_json" > /dev/null; then
            echo "::error::Deployment blocked: ECS infrastructure is stopped or not ready."
            exit 1
          fi

      - name: Download CI image
        uses: actions/download-artifact@v7
        with:
          name: pricing-backend-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load CI image
        run: docker load --input pricing-backend-image.tar
