# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2024-10-18

openapi: 3.0.3
info:
  title: Pricing Backend API
  description: REST API for managing branches, regions, products, and pricing plans.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Branches
  - name: Regions
  - name: Products
  - name: Fees
  - name: Account Attributes
  - name: Eligibility Reasons  
  - name: Pricing Plans

paths:
  /branches:
    get:
      tags: [Branches]
      operationId: listBranches
      summary: List all branches
      responses:
        "200":
          description: Branches sorted by branch code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchListItem"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    post:
      tags: [Branches]
      operationId: createBranch
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
      responses:
        "201":
          $ref: "#/components/responses/BranchDetail"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /branches/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Branches]
      operationId: getBranch
      summary: Get a branch by ID
      responses:
        "200":
          $ref: "#/components/responses/BranchDetail"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    put:
      tags: [Branches]
      operationId: updateBranch
      summary: Replace a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
      responses:
        "200":
          $ref: "#/components/responses/BranchDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    delete:
      tags: [Branches]
      operationId: deleteBranch
      summary: Delete a branch
      responses:
        "204":
          description: Branch deleted
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /regions:
