components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Numeric resource ID
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BranchDetail:
      description: Branch response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BranchDetail"
    RegionDetail:
      description: Region response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegionDetail"
    ProductDetail:
      description: Product response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductDetail"
    FeeDetail:
      description: Fee response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeeDetail"
    PricingPlanDetail:
      description: Pricing plan response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PricingPlanDetail"
    AttributeDetail:
      description: Account attribute response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AttributeDetail"
    ReasonDetail:
      description: Eligibility reason response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReasonDetail"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: The request could not be completed
    SyntheticServiceUnavailable:
      description: Service unavailable. This 503 response is generated by the frontend mutator when the pricing backend is unreachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: The app could not complete the backend request. Please try again later.

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          example: No resource exists with the supplied ID

    Id:
      type: integer
      format: int64
      example: 1

    BranchListItem:
      type: object
      required:
        - id
        - branch
        - state
        - zipCode
        - updatedBy
        - updatedOn
      properties:
        id:
          $ref: "#/components/schemas/Id"
        branch:
          $ref: "#/components/schemas/BranchCodeAndName"
        state:
          $ref: "#/components/schemas/State"
        zipCode:
          $ref: "#/components/schemas/ZipCode"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    BranchDetail:
      allOf:
        - $ref: "#/components/schemas/BranchRequest"
        - type: object
          required:
            - id
            - updatedOn
          properties:
            id:
              $ref: "#/components/schemas/Id"
            updatedOn:
              $ref: "#/components/schemas/DateTime"

    BranchRequest:
      type: object
      required:
        - branchCode
        - branchName
        - state
        - zipCode
        - updatedBy
      properties:
        branchCode:
          $ref: "#/components/schemas/BranchCode"
        branchName:
          $ref: "#/components/schemas/BranchName"
        state:
          $ref: "#/components/schemas/State"
        zipCode:
          $ref: "#/components/schemas/ZipCode"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    RegionListItem:
      type: object
      required:
        - id
        - region
        - states
        - zipCodes
        - branches
        - updatedOn
        - updatedBy
      properties:
        id:
          $ref: "#/components/schemas/Id"
        region:
          $ref: "#/components/schemas/RegionCodeAndName"
        states:
          type: array
          items:
            $ref: "#/components/schemas/State"
        zipCodes:
          type: array
          items:
            $ref: "#/components/schemas/ZipCode"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchCode"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    RegionDetail:
      allOf:
        - $ref: "#/components/schemas/RegionRequest"
