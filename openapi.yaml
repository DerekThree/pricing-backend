# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2024-10-18

openapi: 3.0.3
info:
  title: Pricing Backend API
  description: REST API for managing branches, regions, products, and pricing plans.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Branches
  - name: Regions
  - name: Products
  - name: Pricing Plans
  - name: Account Attributes

paths:
  /branches:
    get:
      tags: [Branches]
      operationId: listBranches
      summary: List all branches
      responses:
        "200":
          description: Branches sorted by branch code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchListItem"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    post:
      tags: [Branches]
      operationId: createBranch
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
      responses:
        "201":
          $ref: "#/components/responses/BranchDetail"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /branches/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Branches]
      operationId: getBranch
      summary: Get a branch by ID
      responses:
        "200":
          $ref: "#/components/responses/BranchDetail"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    put:
      tags: [Branches]
      operationId: updateBranch
      summary: Replace a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
      responses:
        "200":
          $ref: "#/components/responses/BranchDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    delete:
      tags: [Branches]
      operationId: deleteBranch
      summary: Delete a branch
      responses:
        "204":
          description: Branch deleted
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /regions:
    get:
      tags: [Regions]
      operationId: listRegions
      summary: List all regions
      responses:
        "200":
          description: Regions sorted by region code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionListItem"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    post:
      tags: [Regions]
      operationId: createRegion
      summary: Create a region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionRequest"
      responses:
        "201":
          $ref: "#/components/responses/RegionDetail"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /regions/options:
    get:
      tags: [Regions]
      operationId: getCoverageOptions
      summary: Get available region options
      responses:
        "200":
          description: Available states, zip codes, and branches for region forms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageOptions"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /regions/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Regions]
      operationId: getRegion
      summary: Get a region by ID
      responses:
        "200":
          $ref: "#/components/responses/RegionDetail"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    put:
      tags: [Regions]
      operationId: updateRegion
      summary: Replace a region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionRequest"
      responses:
        "200":
          $ref: "#/components/responses/RegionDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    delete:
      tags: [Regions]
      operationId: deleteRegion
      summary: Delete a region
      responses:
        "204":
          description: Region deleted
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List all products
      responses:
        "200":
          description: Products sorted by product code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductListItem"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          $ref: "#/components/responses/ProductDetail"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product by ID
      responses:
        "200":
          $ref: "#/components/responses/ProductDetail"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Replace a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          $ref: "#/components/responses/ProductDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product
      responses:
        "204":
          description: Product deleted
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /pricing-plans:
    get:
      tags: [Pricing Plans]
      operationId: listPricingPlans
      summary: List all pricing plans
      responses:
        "200":
          description: Pricing plans sorted by plan code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricingPlanListItem"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    post:
      tags: [Pricing Plans]
      operationId: createPricingPlan
      summary: Create a pricing plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingPlanRequest"
      responses:
        "201":
          $ref: "#/components/responses/PricingPlanDetail"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /pricing-plans/options:
    get:
      tags: [Pricing Plans]
      operationId: getProductRegionOptions
      summary: Get available pricing plan options
      responses:
        "200":
          description: Available products and regions for pricing plan forms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductRegionOptions"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /pricing-plans/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Pricing Plans]
      operationId: getPricingPlan
      summary: Get a pricing plan by ID
      responses:
        "200":
          $ref: "#/components/responses/PricingPlanDetail"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    put:
      tags: [Pricing Plans]
      operationId: updatePricingPlan
      summary: Replace a pricing plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingPlanRequest"
      responses:
        "200":
          $ref: "#/components/responses/PricingPlanDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    delete:
      tags: [Pricing Plans]
      operationId: deletePricingPlan
      summary: Delete a pricing plan
      responses:
        "204":
          description: Pricing plan deleted
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /account-attributes:
    get:
      tags: [Account Attributes]
      operationId: listAccountAttributes
      summary: List all account attributes
      responses:
        "200":
          description: Account attributes sorted by attribute code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountAttributeListItem"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    post:
      tags: [Account Attributes]
      operationId: createAccountAttribute
      summary: Create an account attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAttributeRequest"
      responses:
        "201":
          $ref: "#/components/responses/AccountAttributeDetail"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /account-attributes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Account Attributes]
      operationId: getAccountAttribute
      summary: Get an account attribute by ID
      responses:
        "200":
          $ref: "#/components/responses/AccountAttributeDetail"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    put:
      tags: [Account Attributes]
      operationId: updateAccountAttribute
      summary: Replace an account attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAttributeRequest"
      responses:
        "200":
          $ref: "#/components/responses/AccountAttributeDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    delete:
      tags: [Account Attributes]
      operationId: deleteAccountAttribute
      summary: Delete an account attribute
      responses:
        "204":
          description: Account attribute deleted
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /eligibility-reasons:
    get:
      tags: [Eligibility Reasons]
      operationId: listEligibilityReasons
      summary: List all eligibility reasons
      responses:
        "200":
          description: Eligibility reasons sorted by reason code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EligibilityReasonListItem"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    post:
      tags: [Eligibility Reasons]
      operationId: createEligibilityReason
      summary: Create an eligibility reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityReasonRequest"
      responses:
        "201":
          $ref: "#/components/responses/EligibilityReasonDetail"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /eligibility-reasons/options:
    get:
      tags: [Eligibility Reasons]
      operationId: getEligibilityReasonOptions
      summary: Get available eligibility reason options
      responses:
        "200":
          description: Available account attributes for eligibility reason forms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityReasonOptions"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

  /eligibility-reasons/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Eligibility Reasons]
      operationId: getEligibilityReason
      summary: Get an eligibility reason by ID
      responses:
        "200":
          $ref: "#/components/responses/EligibilityReasonDetail"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    put:
      tags: [Eligibility Reasons]
      operationId: updateEligibilityReason
      summary: Replace an eligibility reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityReasonRequest"
      responses:
        "200":
          $ref: "#/components/responses/EligibilityReasonDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    delete:
      tags: [Eligibility Reasons]
      operationId: deleteEligibilityReason
      summary: Delete an eligibility reason
      responses:
        "204":
          description: Eligibility reason deleted
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Numeric resource ID
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BranchDetail:
      description: Branch response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BranchDetail"
    RegionDetail:
      description: Region response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegionDetail"
    ProductDetail:
      description: Product response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProductDetail"
    PricingPlanDetail:
      description: Pricing plan response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PricingPlanDetail"
    AccountAttributeDetail:
      description: Account attribute response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountAttributeDetail"
    EligibilityReasonDetail:
      description: Eligibility reason response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EligibilityReasonDetail"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: The request could not be completed
    SyntheticServiceUnavailable:
      description: Service unavailable. This 503 response is generated by the frontend mutator when the pricing backend is unreachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: The app could not complete the backend request. Please try again later.

  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          example: No resource exists with the supplied ID

    Id:
      type: integer
      format: int64
      example: 1

    BranchListItem:
      type: object
      required:
        - id
        - branch
        - state
        - zipCode
        - updatedBy
        - updatedOn
      properties:
        id:
          $ref: "#/components/schemas/Id"
        branch:
          $ref: "#/components/schemas/BranchCodeAndName"
        state:
          $ref: "#/components/schemas/State"
        zipCode:
          $ref: "#/components/schemas/ZipCode"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    BranchDetail:
      allOf:
        - $ref: "#/components/schemas/BranchRequest"
        - type: object
          required:
            - id
            - updatedOn
          properties:
            id:
              $ref: "#/components/schemas/Id"
            updatedOn:
              $ref: "#/components/schemas/DateTime"

    BranchRequest:
      type: object
      required:
        - branchCode
        - branchName
        - state
        - zipCode
        - updatedBy
      properties:
        branchCode:
          $ref: "#/components/schemas/BranchCode"
        branchName:
          $ref: "#/components/schemas/BranchName"
        state:
          $ref: "#/components/schemas/State"
        zipCode:
          $ref: "#/components/schemas/ZipCode"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    RegionListItem:
      type: object
      required:
        - id
        - region
        - states
        - zipCodes
        - branches
        - updatedOn
        - updatedBy
      properties:
        id:
          $ref: "#/components/schemas/Id"
        region:
          $ref: "#/components/schemas/RegionCodeAndName"
        states:
          type: array
          items:
            $ref: "#/components/schemas/State"
        zipCodes:
          type: array
          items:
            $ref: "#/components/schemas/ZipCode"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchCode"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    RegionDetail:
      type: object
      required:
        - id
        - regionCode
        - regionName
        - states
        - zipCodes
        - branches
        - formOptions
        - updatedOn
        - updatedBy
      properties:
        id:
          $ref: "#/components/schemas/Id"
        regionCode:
          $ref: "#/components/schemas/RegionCode"
        regionName:
          $ref: "#/components/schemas/RegionName"
        states:
          type: array
          items:
            $ref: "#/components/schemas/State"
        zipCodes:
          type: array
          items:
            $ref: "#/components/schemas/ZipCode"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        formOptions:
          $ref: "#/components/schemas/CoverageOptions"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    RegionRequest:
      type: object
      required:
        - regionCode
        - regionName
        - states
        - zipCodes
        - branches
        - updatedBy
      properties:
        regionCode:
          $ref: "#/components/schemas/RegionCode"
        regionName:
          $ref: "#/components/schemas/RegionName"
        states:
          type: array
          items:
            $ref: "#/components/schemas/State"
        zipCodes:
          type: array
          items:
            $ref: "#/components/schemas/ZipCode"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    CoverageOptions:
      type: object
      required:
        - states
        - zipCodes
        - branches
      properties:
        states:
          type: array
          items:
            $ref: "#/components/schemas/State"
        zipCodes:
          type: array
          items:
            $ref: "#/components/schemas/ZipCode"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchOption"

    BranchOption:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        code:
          $ref: "#/components/schemas/BranchCode"
        name:
          $ref: "#/components/schemas/BranchName"

    ProductListItem:
      type: object
      required:
        - id
        - product
        - productType
        - updatedOn
        - updatedBy
      properties:
        id:
          $ref: "#/components/schemas/Id"
        product:
          $ref: "#/components/schemas/ProductCodeAndName"
        productType:
          $ref: "#/components/schemas/ProductType"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductRequest"
        - type: object
          required:
            - id
            - updatedOn
          properties:
            id:
              $ref: "#/components/schemas/Id"
            updatedOn:
              $ref: "#/components/schemas/DateTime"

    ProductRequest:
      type: object
      required:
        - productCode
        - productName
        - productType
        - updatedBy
      properties:
        productCode:
          $ref: "#/components/schemas/ProductCode"
        productName:
          $ref: "#/components/schemas/ProductName"
        productType:
          $ref: "#/components/schemas/ProductType"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    PricingPlanListItem:
      type: object
      required:
        - id
        - pricingPlan
        - product
        - region
        - activeFrom
        - activeThrough
        - updatedOn
        - updatedBy
      properties:
        id:
          $ref: "#/components/schemas/Id"
        pricingPlan:
          $ref: "#/components/schemas/PricingPlanCodeAndName"
        product:
          $ref: "#/components/schemas/ProductCodeAndName"
        region:
          $ref: "#/components/schemas/RegionCodeAndName"
        activeFrom:
          $ref: "#/components/schemas/Date"
        activeThrough:
          $ref: "#/components/schemas/Date"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    PricingPlanDetail:
      type: object
      required:
        - id
        - planCode
        - planName
        - productId
        - regionId
        - formOptions
        - activeFrom
        - activeThrough
        - updatedOn
        - updatedBy
      properties:
        id:
          $ref: "#/components/schemas/Id"
        planCode:
          $ref: "#/components/schemas/PricingPlanCode"
        planName:
          $ref: "#/components/schemas/PricingPlanName"
        productId:
          $ref: "#/components/schemas/Id"
        regionId:
          $ref: "#/components/schemas/Id"
        formOptions:
          $ref: "#/components/schemas/ProductRegionOptions"
        activeFrom:
          $ref: "#/components/schemas/Date"
        activeThrough:
          $ref: "#/components/schemas/Date"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    PricingPlanRequest:
      type: object
      required:
        - planCode
        - planName
        - productId
        - regionId
        - activeFrom
        - activeThrough
        - updatedBy
      properties:
        planCode:
          $ref: "#/components/schemas/PricingPlanCode"
        planName:
          $ref: "#/components/schemas/PricingPlanName"
        productId:
          $ref: "#/components/schemas/Id"
        regionId:
          $ref: "#/components/schemas/Id"
        activeFrom:
          $ref: "#/components/schemas/Date"
        activeThrough:
          $ref: "#/components/schemas/Date"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    ProductRegionOptions:
      type: object
      required:
        - products
        - regions
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductOption"
        regions:
          type: array
          items:
            $ref: "#/components/schemas/RegionOption"

    AccountAttributeListItem:
      type: object
      required:
        - id
        - attribute
        - type
        - updatedOn
        - updatedBy
      properties:
        id:
          $ref: "#/components/schemas/Id"
        attribute:
          $ref: "#/components/schemas/AccountAttributeCodeAndName"
        type:
          $ref: "#/components/schemas/AccountAttributeType"
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    AccountAttributeDetail:
      allOf:
        - $ref: "#/components/schemas/AccountAttributeRequest"
        - type: object
          required:
            - id
            - updatedOn
          properties:
            id:
              $ref: "#/components/schemas/Id"
            updatedOn:
              $ref: "#/components/schemas/DateTime"

    AccountAttributeRequest:
      type: object
      required:
        - attributeCode
        - attributeName
        - attributeType
        - updatedBy
      properties:
        attributeCode:
          $ref: "#/components/schemas/AccountAttributeCode"
        attributeName:
          $ref: "#/components/schemas/AccountAttributeName"
        attributeType:
          $ref: "#/components/schemas/AccountAttributeType"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    EligibilityReasonListItem:
      type: object
      required:
        - id
        - eligibilityReason
        - conditions
        - updatedOn
        - updatedBy
      properties:
        id:
          $ref: "#/components/schemas/Id"
        eligibilityReason:
          $ref: "#/components/schemas/EligibilityReasonCodeAndName"
        conditions:
          type: array
          items:
            type: string
        updatedOn:
          $ref: "#/components/schemas/DateTime"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    EligibilityReasonDetail:
      allOf:
        - $ref: "#/components/schemas/EligibilityReasonRequest"
        - type: object
          required:
            - id
            - formOptions
            - updatedOn
          properties:
            id:
              $ref: "#/components/schemas/Id"
            formOptions:
              $ref: "#/components/schemas/EligibilityReasonOptions"
            updatedOn:
              $ref: "#/components/schemas/DateTime"

    EligibilityReasonRequest:
      type: object
      required:
        - reasonCode
        - reasonName
        - conditions
        - updatedBy
      properties:
        reasonCode:
          $ref: "#/components/schemas/EligibilityReasonCode"
        reasonName:
          $ref: "#/components/schemas/EligibilityReasonName"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/EligibilityReasonCondition"
        updatedBy:
          $ref: "#/components/schemas/UpdatedBy"

    EligibilityReasonOptions:
      type: object
      required:
        - attributes
      properties:
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/AccountAttributeOption"

    EligibilityReasonCondition:
      type: object
      required:
        - attribute
        - operator
        - value
      properties:
        attribute:
          $ref: "#/components/schemas/Id"
        operator:
          $ref: "#/components/schemas/EligibilityReasonOperator"
        value:
          $ref: "#/components/schemas/EligibilityReasonConditionValue"

    EligibilityReasonConditionValue:
      oneOf:
        - type: string
        - type: number
        - type: boolean

    AccountAttributeOption:
      type: object
      required:
        - id
        - code
        - name
        - type
      properties:
        id:
          $ref: "#/components/schemas/Id"
        code:
          $ref: "#/components/schemas/AccountAttributeCode"
        name:
          $ref: "#/components/schemas/AccountAttributeName"
        type:
          $ref: "#/components/schemas/AccountAttributeType"

    ProductOption:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        code:
          $ref: "#/components/schemas/ProductCode"
        name:
          $ref: "#/components/schemas/ProductName"

    RegionOption:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        code:
          $ref: "#/components/schemas/RegionCode"
        name:
          $ref: "#/components/schemas/RegionName"

    BranchCode:
      type: string
      pattern: "^[A-Z0-9]{8}$"
      example: "10000001"

    RegionCode:
      type: string
      pattern: "^[A-Z0-9]{8}$"
      example: MIDWEST1

    ProductCode:
      type: string
      pattern: "^[A-Z0-9]{8}$"
      example: 1FC00012

    PricingPlanCode:
      type: string
      pattern: "^[A-Z0-9]{8}$"
      example: DC11R112

    BranchName:
      type: string
      minLength: 1
      maxLength: 100
      example: Chicago 104th St.

    RegionName:
      type: string
      minLength: 1
      maxLength: 100
      example: Midwest

    ProductName:
      type: string
      minLength: 1
      maxLength: 100
      example: Free Checking

    PricingPlanName:
      type: string
      minLength: 1
      maxLength: 100
      example: Free Checking Midwest

    AccountAttributeCode:
      type: string
      pattern: "^[A-Z0-9]{8}$"
      example: ATTR0001

    AccountAttributeName:
      type: string
      minLength: 1
      maxLength: 100
      example: Account Open Date

    EligibilityReasonCode:
      type: string
      pattern: "^[A-Z0-9]{8}$"
      example: ELIG0001

    EligibilityReasonName:
      type: string
      minLength: 1
      maxLength: 100
      example: Min. Balance

    UpdatedBy:
      type: string
      minLength: 1
      maxLength: 100
      example: Derek Ochal

    BranchCodeAndName:
      type: string
      pattern: "^[0-9]{8} - .{1,100}$"
      example: "10000001 - Chicago 104th St."

    RegionCodeAndName:
      type: string
      pattern: "^[0-9]{8} - .{1,100}$"
      example: "10000001 - Midwest"

    ProductCodeAndName:
      type: string
      pattern: "^[0-9]{8} - .{1,100}$"
      example: "10000001 - Free Checking"

    PricingPlanCodeAndName:
      type: string
      pattern: "^[0-9]{8} - .{1,100}$"
      example: "10000001 - Free Checking Midwest"

    AccountAttributeCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{8} - .{1,100}$"
      example: "ATTR0001 - Account Open Date"

    EligibilityReasonCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{8} - .{1,100}$"
      example: "ELIG0001 - Min. Balance"

    State:
      type: string
      pattern: "^[A-Z]{2}$"
      example: IL

    ZipCode:
      type: string
      pattern: "^[0-9]{5}$"
      example: "60459"

    ProductType:
      type: string
      enum:
        - DEPOSIT
        - CREDIT
      example: DEPOSIT

    AccountAttributeType:
      type: string
      enum:
        - TEXT
        - DECIMAL
        - INTEGER
        - DATE
        - BOOLEAN
      example: TEXT

    EligibilityReasonOperator:
      type: string
      enum:
        - "="
        - ">"
        - "<"
        - ">="
        - "<="
        - "<>"
      example: "="

    Date:
      type: string
      format: date
      example: "2026-12-31"

    DateTime:
      type: string
      format: date-time
      example: "2026-12-31T23:59:59+08:00"
