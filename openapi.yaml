        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    put:
      tags: [Pricing Plans]
      operationId: updatePricingPlan
      summary: Replace a pricing plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingPlanRequest"
      responses:
        "200":
          $ref: "#/components/responses/PricingPlanDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    delete:
      tags: [Pricing Plans]
      operationId: deletePricingPlan
      summary: Delete a pricing plan
      responses:
        "204":
          description: Pricing plan deleted
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /account-attributes:
    get:
      tags: [Account Attributes]
      operationId: listAttributes
      summary: List all account attributes
      responses:
        "200":
          description: Account attributes sorted by attribute code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttributeListItem"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/SyntheticServiceUnavailable"
    post:
      tags: [Account Attributes]
      operationId: createAttribute
      summary: Create an account attribute
      requestBody:
        required: true
        content:
