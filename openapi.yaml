        - name
        - type
      properties:
        id:
          $ref: "#/components/schemas/Id"
        code:
          $ref: "#/components/schemas/ProductCode"
        name:
          $ref: "#/components/schemas/ProductName"
        type:
          $ref: "#/components/schemas/ProductType"

    RegionOption:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          $ref: "#/components/schemas/Id"
        code:
          $ref: "#/components/schemas/RegionCode"
        name:
          $ref: "#/components/schemas/RegionName"

    FeeOption:
      type: object
      required:
        - id
        - code
        - name
        - type
        - productTypes
      properties:
        id:
          $ref: "#/components/schemas/Id"
        code:
          $ref: "#/components/schemas/FeeCode"
        name:
          $ref: "#/components/schemas/FeeName"
        type:
          $ref: "#/components/schemas/FeeType"  
        productTypes:
          type: array
          items:
            $ref: "#/components/schemas/ProductType"

    BranchCode:
      type: string
      pattern: "^[A-Z0-9]{1,25}$"
      example: "10000001"

    RegionCode:
      type: string
      pattern: "^[A-Z0-9]{1,25}$"
      example: MIDWEST1

    ProductCode:
      type: string
      pattern: "^[A-Z0-9]{1,25}$"
      example: 1FC00012

    FeeCode:
      type: string
      pattern: "^[A-Z0-9]{1,25}$"
      example: FEE00001

    PricingPlanCode:
      type: string
      pattern: "^[A-Z0-9]{1,25}$"
      example: DC11R112

    BranchName:
      type: string
      minLength: 1
      maxLength: 100
      example: Chicago 104th St.

    RegionName:
      type: string
      minLength: 1
      maxLength: 100
      example: Midwest

    ProductName:
      type: string
      minLength: 1
      maxLength: 100
      example: Free Checking

    FeeName:
      type: string
      minLength: 1
      maxLength: 100
      example: Monthly Maintenance Fee

    PricingPlanName:
      type: string
      minLength: 1
      maxLength: 100
      example: Free Checking Midwest

    SimulatorDate:
      type: object
      required:
        - currentDate
      properties:
        currentDate:
          type: string
          format: date

    AttributeCode:
      type: string
      pattern: "^[A-Z0-9]{1,25}$"
      example: ATTR0001

    AttributeName:
      type: string
      minLength: 1
      maxLength: 100
      example: Account Open Date

    ReasonCode:
      type: string
      pattern: "^[A-Z0-9]{1,25}$"
      example: ELIG0001

    ReasonName:
      type: string
      minLength: 1
      maxLength: 100
      example: Min. Balance

    UpdatedBy:
      type: string
      minLength: 1
      maxLength: 100
      example: Derek Ochal

    BranchCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{1,25} - .{1,100}$"
      example: "10000001 - Chicago 104th St."

    RegionCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{1,25} - .{1,100}$"
      example: "10000001 - Midwest"

    ProductCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{1,25} - .{1,100}$"
      example: "10000001 - Free Checking"

    FeeCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{1,25} - .{1,100}$"
      example: "FEE00001 - Monthly Maintenance Fee"

    PricingPlanCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{1,25} - .{1,100}$"
      example: "10000001 - Free Checking Midwest"

    AttributeCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{1,25} - .{1,100}$"
      example: "ATTR0001 - Account Open Date"

    ReasonCodeAndName:
      type: string
      pattern: "^[A-Z0-9]{1,25} - .{1,100}$"
      example: "ELIG0001 - Min. Balance"

    State:
      type: string
      pattern: "^[A-Z]{2}$"
      example: IL

    ZipCode:
      type: string
      pattern: "^[0-9]{5}$"
      example: "60459"

    ProductType:
      type: string
      enum:
        - DEPOSIT
        - CD
        - CREDIT
      example: DEPOSIT

    FeeType:
      type: string
      enum:
        - FLAT
        - PERCENT
      example: FLAT

    AttributeType:
      type: string
      enum:
        - TEXT
        - DECIMAL
        - INTEGER
        - DATE
        - BOOLEAN
      example: TEXT

    ReasonOperator:
      type: string
      enum:
        - "="
        - ">"
        - "<"
        - ">="
        - "<="
        - "<>"
      example: "="

    Date:
      type: string
      format: date
      example: "2026-12-31"

    DateTime:
      type: string
      format: date-time
      example: "2026-12-31T23:59:59+08:00"
